    async function addToCart(productId, quantity, requiresSize = false) {
        // First check if an image is selected
        const fileInput = document.getElementById('imageUpload');
        if (!fileInput.files || fileInput.files.length === 0) {
            Swal.fire({
                icon: 'warning',
                title: 'Image Required',
                text: 'Please select an image before adding to cart.'
            });
            return;
        }

        // Show loading state
        Swal.fire({
            title: 'Processing...',
            text: 'Uploading image and adding to cart',
            allowOutsideClick: false,
            didOpen: () => {
                Swal.showLoading();
            }
        });

        try {
            // Upload image first
            const imageResult = await uploadImage();
            if (!imageResult) {
                throw new Error('Image upload failed');
            }

            const selectedSize = document.querySelector('input[name="size"]:checked')?.value || null;
            if (requiresSize && !selectedSize) {
                throw new Error('Please select a size before adding to cart.');
            }

            const productQuantity = parseInt(quantity);
            const productName = document.getElementById('product-name').innerText;
            const price = document.getElementById('product-price').innerText;

            const response = await fetch('https://70a1dz3t08.execute-api.us-east-1.amazonaws.com/prod/cart', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId,
                    productId,
                    quantity: productQuantity,
                    size: selectedSize,
                    imageUrl: imageResult,
                    product_name: productName,
                    price: price,
                }),
            });

            if (!response.ok) {
                throw new Error('Failed to add item to cart');
            }

            await updateCartCount();

            // Success message
            Swal.fire({
                icon: 'success',
                title: 'Added to Cart!',
                text: 'Your item has been added. Redirecting...',
                timer: 1500,
                showConfirmButton: false
            });

            setTimeout(() => {
                window.location.href = 'cart.html';
            }, 1500);

        } catch (error) {
            console.error('Error:', error);
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: error.message
            });
        }
    }

    // Add an event listener to the file input to show preview

            };
            reader.readAsDataURL(file);
        }
    });


    async function uploadImage() {
        const fileInput = document.getElementById('imageUpload');
        const file = fileInput.files[0];

        if (!file) {
            return null;
        }

        try {
            // Convert file to base64
            const base64Data = await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const base64 = reader.result.split(',')[1];
                    resolve(base64);
                };
                reader.readAsDataURL(file);
            });

            // Upload to server
            const response = await fetch('https://70a1dz3t08.execute-api.us-east-1.amazonaws.com/prod/photo', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    image: base64Data,
                    mimeType: file.type
                })
            });

            if (!response.ok) {
                throw new Error('Upload failed');
            }

            const result = await response.json();
            imageUploaded = true;
            return `https://zahzouh.de/${result.key}`;

        } catch (error) {
            console.error('Upload error:', error);
            Swal.fire({
                icon: 'error',
                title: 'Upload Failed',
                text: 'Failed to upload image. Please try again.'
            });
            return null;
        }
    }

    async function fetchProductDetails(productId) {
        try {
            const response = await fetch(`https://70a1dz3t08.execute-api.us-east-1.amazonaws.com/prod/products/?PK=${productId}`);
            const data = await response.json();
            console.log("test");
            // Update basic product details
            document.getElementById('product-name').innerText = data.product_name || 'Product Name';
            document.getElementById('product-short-description').innerText = data.short_description || 'No description available.';
            document.getElementById('product-category').innerText = data.categorie || 'Flexible Magnets';

            // Handle media list
            const mainMedia = document.getElementById('main-media');
            const thumbContainer = document.getElementById('thumbnail-wrapper');
            mainMedia.innerHTML = '';
            thumbContainer.innerHTML = '';

            let mediaUrls = data.image_url;
            mediaUrls = (mediaUrls || []).flat().filter(url => typeof url === 'string' && url.trim() !== '');
            if (mediaUrls.length === 0) {
                mediaUrls = ['https://via.placeholder.com/500'];
            }

            const createElement = (url, isMain) => {
                const isVideo = /\.(mp4|webm|ogg|mov)$/i.test(url);
                if (isVideo) {
                    const video = document.createElement('video');
                    video.src = url;
                    if (isMain) {
                        video.controls = true;
                    } else {
                        video.muted = true;
                        video.playsInline = true;
                    }
                    return video;
                } else {
                    const img = document.createElement('img');
                    img.src = url;
                    img.alt = data.product_name || 'Product Image';
                    return img;
                }
            };

            const setMain = (url, thumb) => {
                mainMedia.innerHTML = '';
                mainMedia.appendChild(createElement(url, true));
                document.querySelectorAll('#thumbnail-wrapper .active').forEach(el => el.classList.remove('active'));
                if (thumb) thumb.classList.add('active');
            };

            mediaUrls.forEach((url, index) => {
                const thumb = createElement(url, false);
                thumb.addEventListener('click', () => setMain(url, thumb));
                if (index === 0) {
                    setMain(url, thumb);
                }
                thumbContainer.appendChild(thumb);
            });

            // Handle size and pricing
            const sizeSelector = document.querySelector('.size-selector');
            const sizeContainer = sizeSelector.querySelector('.d-flex');
            sizeContainer.innerHTML = '';

            const sizes = data.sizes || {};
            if (Object.keys(sizes).length > 0) {
                sizeSelector.style.display = 'block';
                let first = true;

                for (const [size, details] of Object.entries(sizes)) {
                    const id = `size-${size.replace(/\D/g, '')}`;
                    sizeContainer.innerHTML += `
                    <input type="radio" class="btn-check" name="size" id="${id}" value="${size}" autocomplete="off" ${first ? 'checked' : ''}>
                    <label class="size-card btn btn-outline-secondary" for="${id}"><strong>${size}</strong> - €${details.price.toFixed(2)}</label>
                `;
                    first = false;
                }

                // Set initial price
                const initialSize = Object.keys(sizes)[0];
                document.getElementById('product-price').innerText = `€${sizes[initialSize].price.toFixed(2)}`;

                // Update price on size change
                document.querySelectorAll('input[name="size"]').forEach(input => {
                    input.addEventListener('change', () => {
                        const selectedSize = input.value;
                        const newPrice = sizes[selectedSize].price;
                        document.getElementById('product-price').innerText = `€${newPrice.toFixed(2)}`;
                    });
                });

            } else {
                sizeSelector.style.display = 'none';
                document.getElementById('product-price').innerText = `€${data.price || '0.00'}`;
            }

            // Optional: load related products
            if (data.categorie) {
                fetchRelatedProducts(data.categorie);
            }

        } catch (error) {
            console.error('Error fetching product details:', error);
        }
    }

    async function fetchRelatedProducts(category) {
        try {
            const response = await fetch(`https://cib6wa7lsblq7z2zru4ywsac6e0gkwxq.lambda-url.us-east-1.on.aws/?category=${encodeURIComponent(category)}`);
            const relatedProducts = await response.json();

            const relatedContainer = document.getElementById('related-products-list');
            relatedContainer.innerHTML = '';

            relatedProducts.forEach(product => {
                relatedContainer.innerHTML += `
                        <div class="col">
                          <div class="card h-100">
                            <img src="${product.image_url || 'https://via.placeholder.com/300'}" class="card-img-top" alt="${product.product_name}">
                            <div class="card-body text-center">
                              <h5 class="card-title">${product.product_name}</h5>
                              <p class="text-success">€${product.price}</p>
                              <a href="product.html?id=${product.product_id}" class="btn btn-outline-primary btn-sm">View Product</a>
                            </div>
                          </div>
                        </div>
                    `;
            });
        } catch (error) {
            console.error('Error fetching related products:', error);
        }
    }


    function getProductIdFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get('id');
    }
