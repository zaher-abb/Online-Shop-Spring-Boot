<body id="top" data-spy="scroll" data-target=".navbar-collapse" data-offset="50">


<!-- Preloader section -->
<div class="preloader">
    <div class="sk-spinner sk-spinner-pulse"></div>
</div>
<!-- index.html -->
<div id="navbar"></div>

<!-- Contact section -->
<section id="contact" class="parallax-section">
    <div class="overlay"></div>
    <div class="container">
        <div class="row">

            <div class="col-md-offset-2 col-md-8 col-sm-offset-1 col-sm-10">
                <div class="wow fadeInUp section-title" data-wow-delay="0.3s">
                    <h2>Say hello</h2>
                    <h4>write us if you have any question :D !</h4>
                </div>
                <div class="contact-form wow fadeInUp" data-wow-delay="0.7s">
                    <form id="contact-form" method="post" action="#">
                        <input name="name" type="text" class="form-control" placeholder="Your Name" required>
                        <input name="email" type="email" class="form-control" placeholder="Your Email" required>
                        <textarea name="message" class="form-control" placeholder="Message" rows="5" required></textarea>
                        <input type="submit" class="form-control submit" value="SEND MESSAGE">
                    </form>
                </div>
            </div>

        </div>
    </div>
</section>

<!--  Footer -->
<div id="footer"></div>
<!-- javscript js -->
<script src="js/jquery.js"></script>
<script src="js/bootstrap.min.js"></script>

<script src="js/jquery.magnific-popup.min.js"></script>

<script src="js/jquery.sticky.js"></script>
<script src="js/jquery.backstretch.min.js"></script>

<script src="js/isotope.js"></script>
<script src="js/imagesloaded.min.js"></script>
<script src="js/nivo-lightbox.min.js"></script>

<script src="js/jquery.flexslider-min.js"></script>

<script src="js/jquery.parallax.js"></script>
<script src="js/smoothscroll.js"></script>
<script src="js/wow.min.js"></script>

<script src="js/custom.js"></script>



<script>
    fetch('navbar.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('navbar').innerHTML = data;
        });
</script>
<script>
    fetch('footer.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('footer').innerHTML = data;
        });
</script>
<script>
    async function updateCartCount() {
        try {
            const userId = localStorage.getItem('userId');
            const response = await fetch(`https://70a1dz3t08.execute-api.us-east-1.amazonaws.com/prod/cart?userId=${userId}`);

            const cartItems = await response.json();

            document.getElementById('cart-count').textContent = cartItems.length;
            return cartItems.length;
        } catch (error) {
            console.error('Error updating cart count:', error);
        }
    }
    updateCartCount();
</script>
<script>
    document.getElementById('contact-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const name = this.name.value;
        const email = this.email.value;
        const message = this.message.value;

        const response = await fetch('https://70a1dz3t08.execute-api.us-east-1.amazonaws.com/prod/contactus', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, message })
        });

        const result = await response.json();
        alert(result.message || result.error || 'Submission complete.');
    });
</script>

</body>
</html>
